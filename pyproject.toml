[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "parcelwatch"
version = "0.1.0"
description = "Find buildings added, expanded or removed on US parcels between two NAIP dates, and flag the ones with no building permit."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Muhammad Shahid Usman", email = "mapsync360@gmail.com" }]
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "pyogrio>=0.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "requests>=2.31",
    "overturemaps>=0.6",
    "h3>=4.0",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]
# Heavy GPU / ML stack. Installed on Colab, not needed for CI or local non-GPU steps.
ml = [
    "geoai-py",
    "torch",
    "torchvision",
]
notebooks = [
    "jupyter",
    "leafmap",
    "matplotlib",
]

[project.scripts]
parcelwatch = "parcelwatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/parcelwatch"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "B008",  # typer uses function calls in argument defaults
    "RUF001", "RUF002", "RUF003",  # × and → are deliberate in docs and labels
]

[tool.ruff.lint.per-file-ignores]
"src/parcelwatch/review.py" = ["E501"]  # inline HTML, CSS and JS templates
"scripts/make_colab_notebook.py" = ["E501"]  # notebook text

[tool.mypy]
python_version = "3.11"
files = ["src/parcelwatch"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["parcelwatch"]
